---
# Rol identity: construye en la laptop las imágenes de los once servicios
# propios, las empaqueta como bundles y las carga en cada VM de
# plataforma según su variable `own_services` (el slice puede no tener
# internet; los bundles propios no pesan y el patrón de transporte es el
# mismo del plan 09 §5). Las imágenes de terceros llegan por el rol
# images; este rol aporta lo construido.
- name: Directorio de bundles propios (nodo de control)
  ansible.builtin.file:
    path: /tmp/campus-custom
    state: directory
  delegate_to: localhost
  run_once: true
  become: false
  tags: [identity]

- name: Construcción de imágenes propias (nodo de control)
  ansible.builtin.command:
    cmd: make build
    chdir: "{{ playbook_dir }}/../../.."
    creates: /tmp/campus-custom/.build-ok
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: true
  tags: [identity]

- name: Marca de construcción (nodo de control)
  ansible.builtin.file:
    path: /tmp/campus-custom/.build-ok
    state: touch
  delegate_to: localhost
  run_once: true
  become: false
  tags: [identity]

- name: Empaquetado de imágenes propias (nodo de control)
  ansible.builtin.command:
    cmd: docker save -o /tmp/campus-custom/{{ item }}.tar campus-sdn-{{ item }}
    creates: /tmp/campus-custom/{{ item }}.tar
  loop:
    - portal
    - iam
    - registry
    - monitor
    - detection
    - sensor_adapter
    - incidents
    - policies
    - audit
    - console
    - controller_adapter
  delegate_to: localhost
  run_once: true
  become: false
  tags: [identity]

- name: Directorio temporal de bundles propios
  ansible.builtin.file:
    path: /tmp/campus-custom
    state: directory
  tags: [identity]

- name: Copia de bundles propios
  ansible.builtin.copy:
    src: "/tmp/campus-custom/{{ item }}.tar"
    dest: "/tmp/campus-custom/{{ item }}.tar"
  loop: "{{ own_services | default([]) }}"
  tags: [identity]

- name: Carga de imágenes propias
  ansible.builtin.command: docker load -i /tmp/campus-custom/{{ item }}.tar
  loop: "{{ own_services | default([]) }}"
  tags: [identity]

- name: Limpieza de bundles propios
  ansible.builtin.file:
    path: "/tmp/campus-custom/{{ item }}.tar"
    state: absent
  loop: "{{ own_services | default([]) }}"
  tags: [identity]
