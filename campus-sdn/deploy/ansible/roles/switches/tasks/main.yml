---
# Rol switches: Open vSwitch en sw1–sw6, listo para el controlador.
# Configura bridge, OpenFlow 1.3, fail_mode secure, puertos, trunks de
# VLAN y controladores. Las entradas de política (esqueleto, sesión,
# mitigación — LLD 06_reglas §3) las instala la app del controlador de
# forma PROACTIVA: el esqueleto al conectar el switch, la sesión y la
# mitigación por I2 (APPLY_PROFILE / APPLY_MITIGATION). El PACKET_IN
# queda solo para las causas cerradas de aprendizaje (table-miss, ARP,
# LLDP — LLD 06_reglas §2.1). Ansible no dicta flujos: deja el plano
# preparado.
- name: Paquetes de Open vSwitch
  ansible.builtin.apt:
    name: openvswitch-switch
    state: present
  tags: [switches]

- name: Servicio de Open vSwitch activo
  ansible.builtin.systemd:
    name: openvswitch-switch
    state: started
    enabled: true
  tags: [switches]

- name: Bridge presente
  ansible.builtin.command: ovs-vsctl add-br {{ switch_bridge }}
  register: bridge_result
  failed_when: bridge_result.rc != 0 and "already exists" not in bridge_result.stderr
  changed_when: bridge_result.rc == 0
  tags: [switches]

- name: Parámetros del bridge
  ansible.builtin.command: >
    ovs-vsctl set bridge {{ switch_bridge }} protocols=OpenFlow13 fail_mode=secure
    other-config:datapath-id={{ switch_dpid }}
  tags: [switches]

- name: Puertos de datos al bridge
  ansible.builtin.command: ovs-vsctl add-port {{ switch_bridge }} {{ item }}
  loop: "{{ switch_ports }}"
  register: port_result
  failed_when: port_result.rc != 0 and "already exists" not in port_result.stderr
  changed_when: port_result.rc == 0
  tags: [switches]

# Sin `tag`, un puerto con `trunks` no tiene VLAN nativa y OVS descarta
# las tramas sin etiquetar — todo el tráfico de los equipos finales.
# La VLAN 10 es la nativa del slice; 20 y 30 quedan disponibles para
# tráfico etiquetado.
- name: Trunks con VLAN 10 nativa en los puertos de datos
  ansible.builtin.command: ovs-vsctl set port {{ item }} trunks=10,20,30 tag=10
  loop: "{{ switch_ports }}"
  tags: [switches]

# OVS esclaviza las NIC pero no las sube: sin esto los puertos quedan
# administrativamente abajo tras cada arranque y no hay portadora.
- name: Bridge y puertos de datos arriba
  ansible.builtin.command: ip link set {{ item }} up
  loop: "{{ [switch_bridge] + switch_ports }}"
  changed_when: false
  tags: [switches]

- name: Persistencia del estado de los puertos al arrancar
  ansible.builtin.template:
    src: ports-up.service.j2
    dest: /etc/systemd/system/campus-sdn-ports.service
    owner: root
    group: root
    mode: "0644"
  tags: [switches]

- name: Unidad de puertos habilitada
  ansible.builtin.systemd:
    name: campus-sdn-ports
    enabled: true
    state: started
    daemon_reload: true
  tags: [switches]

# La red del proveedor filtra los BPDUs entre VMs (comprobado: sw1 los
# emite y sw2 no los recibe), así que RSTP no puede converger. Mientras
# el esqueleto del piloto reenvíe con la acción NORMAL, la VLAN 10 de
# datos recorre solo un árbol y los enlaces redundantes quedan en la
# VLAN 99 (solo LLDP): visibles para ONOS, fuera del plano de datos.
# Al activar los caminos calculados en ONOS, vuelven a la VLAN 10.
- name: Enlaces redundantes fuera de la VLAN de datos
  ansible.builtin.command: ovs-vsctl set port {{ item }} tag=99 trunks=99
  loop: "{{ switch_redundant_ports | default([]) }}"
  tags: [switches]

- name: Controladores del bridge
  ansible.builtin.command: ovs-vsctl set-controller {{ switch_bridge }} {{ controller_targets | join(' ') }}
  tags: [switches]

- name: Estado del plano
  ansible.builtin.command: ovs-ofctl -O OpenFlow13 show {{ switch_bridge }}
  register: switch_show
  changed_when: false
  tags: [verify]

- name: Resumen del switch
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}:\n{{ switch_show.stdout }}"
  tags: [verify]
