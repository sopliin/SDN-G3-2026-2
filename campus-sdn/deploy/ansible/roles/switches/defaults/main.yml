---
# Valores por defecto del rol switches; el inventario los sobreescribe.
# switch_bridge: nombre del bridge OVS (br0 en el despliegue de 14 VMs;
# el slice actual los trae ya creados con el nombre del switch: sw1, sw2…).
# switch_ports: NICs de datos (ens3 queda fuera: es la gestión).
# switch_dpid: datapath-id estable por switch, para que ONOS reconozca
# siempre al mismo dispositivo.
# controller_targets: los tres nodos ONOS (OOB, red de gestión).
switch_bridge: br0
switch_ports: []
switch_dpid: ""
controller_targets: []

# Credenciales del REST de ONOS para el agente del árbol. Deben coincidir
# con las del rol onos (karaf/karaf es el par por defecto del piloto); el
# vault o el inventario las sobreescriben en ambos roles a la vez.
onos_rest_user: karaf
onos_rest_password: karaf

# Árbol preferido (RA-07): aristas [dpid, puerto]-[dpid, puerto] que el
# agente mantiene mientras todas estén ACTIVAS. Coincide con el árbol de
# datos del inventario §6 y con los switch_redundant_ports del inventario
# (los bloqueados son el resto de enlaces). Raíz lógica: SW1.
tree_preferred_edges:
  - [[1, 4], [4, 4]]   # SW1.ens7  <-> SW4.ens7
  - [[1, 6], [2, 1]]   # SW1.ens9  <-> SW2.ens4
  - [[2, 3], [3, 1]]   # SW2.ens6  <-> SW3.ens4
  - [[4, 7], [5, 2]]   # SW4.ens10 <-> SW5.ens5
  - [[5, 4], [6, 2]]   # SW5.ens7  <-> SW6.ens5
