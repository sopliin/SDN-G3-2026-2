# S3 — servicios de respuesta: Incidentes, Políticas y Auditoría.
# Sin base de datos propia: PostgreSQL vive en postgres.yml (SRV-2) y
# las réplicas se incorporan en una etapa posterior. El bus llega por
# BUS_URL y las órdenes al controlador por I2_URL.
services:
  incidents:
    build:
      context: ../..
      dockerfile: services/incidents/Dockerfile
    container_name: s3-incidents
    restart: unless-stopped
    environment:
      BUS_URL: ${BUS_URL:-}
    ports:
      - "${SERVICE_BIND_IP:-0.0.0.0}:8005:8005"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8005/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  policies:
    build:
      context: ../..
      dockerfile: services/policies/Dockerfile
    container_name: s3-policies
    restart: unless-stopped
    environment:
      BUS_URL: ${BUS_URL:-}
      I2_URL: ${I2_URL:-}
      # El IAM valida la sesión de las rutas de reglas y elevaciones
      # (require_permission); sin IAM_URL quedarían en modo de pruebas.
      IAM_URL: ${IAM_URL:-http://iam:8001}
      RATE_LIMIT_PPS: "1000"
      MITIGATION_TTL_S: "300"
      # Directorio académico y motor de reglas en bd_politicas (SRV-2),
      # la misma base del IAM; sin estas variables el servicio usa el
      # almacén en memoria.
      PGHOST: ${PGHOST:-10.0.0.12}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: ${PGDATABASE:-bd_politicas}
      # Tokens de sincronización y servicio: llegan del entorno, nunca
      # del repositorio. La frescura del directorio y el umbral de
      # impacto son parámetros del motor.
      POLICY_SYNC_TOKEN: ${POLICY_SYNC_TOKEN:-}
      POLICY_SERVICE_TOKEN: ${POLICY_SERVICE_TOKEN:-}
      DIRECTORY_MAX_STALENESS_S: ${DIRECTORY_MAX_STALENESS_S:-300}
      PREVIEW_IMPACT_THRESHOLD: ${PREVIEW_IMPACT_THRESHOLD:-25}
    ports:
      - "${SERVICE_BIND_IP:-0.0.0.0}:8006:8006"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8006/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  audit:
    build:
      context: ../..
      dockerfile: services/audit/Dockerfile
    container_name: s3-audit
    restart: unless-stopped
    environment:
      BUS_URL: ${BUS_URL:-}
    ports:
      - "${SERVICE_BIND_IP:-0.0.0.0}:8007:8007"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8007/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
