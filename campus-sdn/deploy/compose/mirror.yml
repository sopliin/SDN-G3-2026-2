# Espejo — Suricata sobre la NIC del espejo (ens6 cuando la nube la
# entregue) y el adaptador del sensor que convierte su EVE en
# MetricSample por el bus. Vive en SRV-1; en SRV-2/3 se incluye dentro
# de s2-observability.yml y queda inactivo hasta que el espejo se
# distribuya (etapa posterior).
services:
  suricata:
    image: jasonish/suricata:7.0
    container_name: s2-suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: -i ${MIRROR_IFACE:-ens6} -c /etc/suricata/suricata.yaml
    volumes:
      - suricata_logs:/var/log/suricata
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep -q suricata"]
      interval: 15s
      timeout: 5s
      retries: 5

  sensor_adapter:
    build:
      context: ../..
      dockerfile: services/sensor_adapter/Dockerfile
    container_name: s2-sensor-adapter
    restart: unless-stopped
    environment:
      BUS_URL: ${BUS_URL:-}
      SENSOR_WINDOW_S: "10"
    volumes:
      - suricata_logs:/var/log/suricata
    ports:
      - "${SERVICE_BIND_IP:-0.0.0.0}:8009:8009"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8009/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  suricata_logs:
