# S2 — Observabilidad: Monitor, Detección, Prometheus y Grafana.
# El espejo (Suricata + sensor_adapter) se incluye desde mirror.yml:
# en SRV-2/3 queda inactivo hasta que el espejo se distribuya; en SRV-1
# el archivo mirror.yml se incluye directamente con la NIC real.
include:
  - mirror.yml

services:
  monitor:
    build:
      context: ../..
      dockerfile: services/monitor/Dockerfile
    container_name: s2-monitor
    restart: unless-stopped
    environment:
      BUS_URL: ${BUS_URL:-}
      # Lecturas I7 protegidas (require_permission): sin IAM_URL authz
      # queda en modo prototipo y deja pasar todo (medido 2026-11-24).
      IAM_URL: ${IAM_URL:-http://iam:8001}
      SAMPLE_INTERVAL_S: "5"
    ports:
      - "${SERVICE_BIND_IP:-0.0.0.0}:8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  detection:
    build:
      context: ../..
      dockerfile: services/detection/Dockerfile
    container_name: s2-detection
    restart: unless-stopped
    environment:
      BUS_URL: ${BUS_URL:-}
      # Lecturas I7 protegidas (require_permission): sin IAM_URL authz
      # queda en modo prototipo y deja pasar todo (medido 2026-11-24).
      IAM_URL: ${IAM_URL:-http://iam:8001}
      DETECTION_SIGMA: "5"
    ports:
      - "${SERVICE_BIND_IP:-0.0.0.0}:8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: s2-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: s2-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: s2-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?definir GRAFANA_ADMIN_PASSWORD en .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
  grafana_data:
