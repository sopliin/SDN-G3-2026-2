# S1 — Identidad: Portal, IAM, Registro y sus dependencias.
# Los servicios propios se construyen (build) sobre el esqueleto común;
# FreeRADIUS y OpenLDAP son imágenes del lock. El bus (S4) se referencia
# por BUS_URL: sin él, la elevación degrada a 503 (nunca falla el login).
services:
  portal:
    build:
      context: ../..
      dockerfile: services/portal/Dockerfile
    container_name: s1-portal
    restart: unless-stopped
    environment:
      IAM_URL: http://iam:8001
      BUS_URL: ${BUS_URL:-}
      I2_URL: ${I2_URL:-}
      # La solicitud de elevación se reenvía a Políticas con la sesión;
      # sin esta URL el portal responde 503 y no simula el flujo.
      POLICIES_URL: http://policies:8006
    ports:
      - "${SERVICE_BIND_IP:-0.0.0.0}:8080:8080"
    depends_on:
      iam:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  iam:
    build:
      context: ../..
      dockerfile: services/iam/Dockerfile
    container_name: s1-iam
    restart: unless-stopped
    environment:
      # Comunidad → RADIUS contra FreeRADIUS (IdP simulado, F-03 §2);
      # operadores → repositorio propio (bcrypt + TOTP); invitados →
      # registro efímero con TTL.
      RADIUS_HOST: ${RADIUS_HOST:-freeradius}
      RADIUS_SECRET: ${RADIUS_SECRET:-}
      GUEST_TTL_S: "86400"
      STUB_VERIFY: ${STUB_VERIFY:-}
      BUS_URL: ${BUS_URL:-}
      # La sesión ordena el perfil al controlador (I2) y registra la
      # asociación en el Registry: sin estas URLs el login funciona pero
      # la red nunca se entera (login «a medias», F-03 §4/§7).
      I2_URL: ${I2_URL:-}
      REGISTRY_URL: http://registry:8002
      # Contexto ambiental: clase de cada puesto (PC1/PC2 académicos,
      # PC3/PC4 operadores). El estado persistente permite a la consola
      # cambiarlo; el archivo versionado es la semilla.
      WORKSTATIONS_FILE: /app/context/workstations.json
      WORKSTATIONS_STATE_FILE: /data/workstations.json
      # Los operadores sobreviven al reinicio del contenedor; el volumen
      # es local a la instancia (la Etapa 2 de HA lo comparte).
      OPERATORS_FILE: /data/operators.json
      # Solo SRV-2 ejecuta el barrido y el Interim (sesiones
      # compartidas): evita duplicar el accounting.
      IAM_MAINTENANCE: ${IAM_MAINTENANCE:-0}
      # Estado compartido entre srv2 y srv3: PostgreSQL en SRV-2. Sin
      # estas variables (o si la base no responde, el IAM cae a los
      # archivos locales y el login sigue funcionando).
      PGHOST: 10.0.0.12
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: bd_politicas
      # Directorio institucional simulado: el OpenLDAP de SRV-1, por la
      # red de gestión. La consola administra cuentas de comunidad con
      # operaciones LDAP reales (no un mock); en producción ese
      # directorio es de la universidad.
      IDP_LDAP_URL: ldap://192.168.0.11:389
      IDP_LDAP_ADMIN_DN: cn=admin,dc=campus,dc=local
      IDP_LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-}
      # Primer operador (la cadena P24 exige un operador ya existente):
      # solo el arranque usa este token, que vive en el .env (nunca en
      # el repositorio).
      IAM_BOOTSTRAP_TOKEN: ${IAM_BOOTSTRAP_TOKEN:-}
    volumes:
      - ../context/workstations.json:/app/context/workstations.json:ro
      - iam_data:/data
    ports:
      - "${SERVICE_BIND_IP:-0.0.0.0}:8001:8001"
    depends_on:
      openldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  registry:
    build:
      context: ../..
      dockerfile: services/registry/Dockerfile
    container_name: s1-registry
    restart: unless-stopped
    environment:
      BUS_URL: ${BUS_URL:-}
    ports:
      - "${SERVICE_BIND_IP:-0.0.0.0}:8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  freeradius:
    image: freeradius/freeradius-server:3.2.10
    container_name: s1-freeradius
    restart: unless-stopped
    volumes:
      # La imagen no genera clientes por entorno: el IAM entra por el
      # clients.conf generado desde la plantilla (verificado en el slice).
      - ./radius/clients.conf:/etc/freeradius/clients.conf:ro
      - ./radius/mods-ldap:/etc/freeradius/mods-enabled/ldap:ro
      - ./radius/site-default:/etc/freeradius/sites-enabled/default:ro
    ports:
      - "${RADIUS_BIND_IP:-0.0.0.0}:1812:1812/udp"
      - "${RADIUS_BIND_IP:-0.0.0.0}:1813:1813/udp"
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep -q freeradius"]
      interval: 15s
      timeout: 5s
      retries: 5

  openldap:
    image: osixia/openldap:1.5.0
    container_name: s1-openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: campus-sdn
      LDAP_DOMAIN: campus.local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?definir LDAP_ADMIN_PASSWORD en .env}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_PASSWORD: ${LDAP_READONLY_PASSWORD:?definir LDAP_READONLY_PASSWORD en .env}
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
    ports:
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1 -s base namingContexts >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  openldap_data:
  openldap_config:
  iam_data:
