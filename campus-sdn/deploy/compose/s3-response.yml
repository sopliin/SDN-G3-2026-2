# S3 — Respuesta completa: servicios (incidentes, políticas, auditoría)
# y su PostgreSQL. En el despliegue de 14 VMs los archivos se incluyen
# por separado (SRV-2 lleva ambos; SRV-3 solo los servicios); este
# archivo conserva el stack completo para `make build` y pruebas.
include:
  - s3-services.yml
  - postgres.yml
